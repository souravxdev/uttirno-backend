services:
  postgres:
    image: postgres:16-alpine
    container_name: uttirno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uttirno
      POSTGRES_PASSWORD: uttirno_dev
      POSTGRES_DB: uttirno
    ports:
      - '5432:5432'
    volumes:
      - uttirno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uttirno -d uttirno']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uttirno_pgdata:
